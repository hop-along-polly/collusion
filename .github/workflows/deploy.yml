name: Deploy to GitHub Pages

# Builds and publishes the flashcard app. The data gate (`npm run validate:data`) runs
# as part of `npm run build`, so a card that cites a heading which no longer exists in
# the notes fails the deploy rather than shipping a broken citation.
#
# The same build runs on every pull request, where it only checks. Until it did, nothing
# ran before a merge: a branch could only be found broken by the deploy it had already
# broken, which is exactly how a failing test reached master.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let an in-flight one finish rather than cancelling it
# mid-publish. Pull requests get a group per branch instead, so a new push supersedes the
# run it made obsolete rather than queueing behind it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        # Derive the base path from the repository name so a fork or a rename needs no
        # code change. `postbuild` writes the SPA 404.html fallback.
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # Nothing to publish from a pull request, but the build above still has to pass.
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
